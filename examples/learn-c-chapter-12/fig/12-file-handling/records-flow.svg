FF6464}svg:not([data-theme="light"]) .eb{stroke:#7D9BFF}svg:not([data-theme="light"]) .ep{stroke:#7D9BFF}svg:not([data-theme="light"]) .hk{fill:#FFFFFF}svg:not([data-theme="light"]) .hr{fill:#FF6464}svg:not([data-theme="light"]) .hb{fill:#7D9BFF}svg:not([data-theme="light"]) .hp{stroke:#7D9BFF}svg:not([data-theme="light"]) .dot{fill:#7D9BFF}svg:not([data-theme="light"]) .tick{fill:#FFFFFF}svg:not([data-theme="light"]) .life{stroke:#B9C3CC}svg:not([data-theme="light"]) .plate{fill:#000000}svg:not([data-theme="light"]) .plateb{fill:#1C2126}svg:not([data-theme="light"]) .ink{fill:#FFFFFF}svg:not([data-theme="light"]) .soft{fill:#B9C3CC}svg:not([data-theme="light"]) .hink{fill:#000000}}svg[data-theme="dark"] .bg{fill:#000000}svg[data-theme="dark"] .sh{fill:#6F7B86}svg[data-theme="dark"] .box{fill:#15181B;stroke:#FFFFFF}svg[data-theme="dark"] .hot{fill:#FFE600;stroke:#FFFFFF}svg[data-theme="dark"] .mut{fill:#3A424A;stroke:#FFFFFF}svg[data-theme="dark"] .band{fill:#1C2126;stroke:#FFFFFF}svg[data-theme="dark"] .note{fill:#15181B;stroke:#FFFFFF}svg[data-theme="dark"] .deco{stroke:#FFFFFF}svg[data-theme="dark"] .ek{stroke:#FFFFFF}svg[data-theme="dark"] .er{stroke:#FF6464}svg[data-theme="dark"] .eb{stroke:#7D9BFF}svg[data-theme="dark"] .ep{stroke:#7D9BFF}svg[data-theme="dark"] .hk{fill:#FFFFFF}svg[data-theme="dark"] .hr{fill:#FF6464}svg[data-theme="dark"] .hb{fill:#7D9BFF}svg[data-theme="dark"] .hp{stroke:#7D9BFF}svg[data-theme="dark"] .dot{fill:#7D9BFF}svg[data-theme="dark"] .tick{fill:#FFFFFF}svg[data-theme="dark"] .life{stroke:#B9C3CC}svg[data-theme="dark"] .plate{fill:#000000}svg[data-theme="dark"] .plateb{fill:#1C2126}svg[data-theme="dark"] .ink{fill:#FFFFFF}svg[data-theme="dark"] .soft{fill:#B9C3CC}svg[data-theme="dark"] .hink{fill:#000000}</style>
