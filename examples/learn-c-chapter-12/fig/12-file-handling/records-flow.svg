<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 776" width="400" height="776" role="img" aria-labelledby="records-flow-t records-flow-d" data-kind="flow" data-count="7">
<title id="records-flow-t">Flow chart, top to bottom</title>
<desc id="records-flow-d">Flow chart, top to bottom. ./records add Eve 88 leads to load: students.txt → vector. load: students.txt → vector leads to file read? file read? yes: push Eve onto the vector. file read? no: exit 1. push Eve onto the vector leads to save: write students.tmp, fsync, rename. save: write students.tmp, fsync, rename leads to students.txt by the highlighted path. save: write students.tmp, fsync, rename is highlighted.</desc>
