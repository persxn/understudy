<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 384" width="728" height="384" role="img" aria-labelledby="board-and-notebook-t board-and-notebook-d" data-kind="layers" data-count="5">
<title id="board-and-notebook-t">What dies with the process, and what stays</title>
<desc id="board-and-notebook-d">Layers, top to bottom. The process's memory (wiped when main returns) holds int visits and records array. The operating system (looks after files) holds files and folders. The storage device (kept with the power off) holds forgets.c and marks.txt. forgets.c and marks.txt are highlighted.</desc>
