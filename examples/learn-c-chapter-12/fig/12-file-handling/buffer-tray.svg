<title id="buffer-tray-t">Flow chart, top to bottom</title>
<desc id="buffer-tray-d">Flow chart, top to bottom. your program fprintf leads to buffer in the FILE record (fast: copy bytes). buffer in the FILE record leads to operating system (when full, fflush or fclose). operating system leads to late.txt. buffer in the FILE record is highlighted.</desc>
