<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 544" width="624" height="544" role="img" aria-labelledby="fsync-sequence-t fsync-sequence-d" data-kind="sequence" data-count="4">
<title id="fsync-sequence-t">write returns at once; fsync waits for the disk</title>
<desc id="fsync-sequence-d">Sequence between your program, kernel page cache and disk, in time order. your program sends write 1000 bytes to kernel page cache. kernel page cache replies to your program: done (in memory only). your program sends fsync to kernel page cache. kernel page cache sends write the cached pages to disk. disk replies to kernel page cache: stored. kernel page cache replies to your program: fsync returns 0. Note over kernel page cache and disk: without fsync this happens seconds later.</desc>
