<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 464" width="712" height="464" role="img" aria-labelledby="stdio-layers-t stdio-layers-d" data-kind="layers" data-count="6">
<title id="stdio-layers-t">Who does what when you call fputc</title>
<desc id="stdio-layers-d">Layers, top to bottom. Your process (user space) holds your code and C library: fputc and the buffer. The operating system kernel (protected) holds write system call and descriptor table: 0, 1, 2, 3. Devices holds disk and screen. C library: fputc and the buffer leads to write system call. write system call leads to disk. write system call is highlighted.</desc>
