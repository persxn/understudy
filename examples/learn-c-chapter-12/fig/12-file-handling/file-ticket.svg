<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 424" width="480" height="424" role="img" aria-labelledby="file-ticket-t file-ticket-d" data-kind="flow" data-count="4">
<title id="file-ticket-t">Flow chart, top to bottom</title>
<desc id="file-ticket-d">Flow chart, top to bottom. your program leads to C library fopen (name + mode). C library fopen leads to diary.txt on disk (find or create). C library fopen leads to FILE record position, mode, bytes (fills in). FILE record position, mode, bytes leads back to your program by a dashed arrow (FILE * (or NULL)). FILE record position, mode, bytes is highlighted.</desc>
