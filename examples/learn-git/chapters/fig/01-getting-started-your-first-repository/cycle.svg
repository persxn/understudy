<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 208" width="600" height="208" role="img" aria-labelledby="cycle-t cycle-d" data-kind="flow" data-count="4">
<title id="cycle-t">The everyday cycle</title>
<desc id="cycle-d">Flow chart, left to right. edit leads to git status. git status leads to git add. git add leads to git commit. git commit leads back to edit by a dashed arrow (repeat). git commit is highlighted.</desc>
