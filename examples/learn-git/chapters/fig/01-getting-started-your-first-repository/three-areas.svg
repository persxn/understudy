<title id="three-areas-t">Three copies of every tracked file</title>
<desc id="three-areas-d">Flow chart, top to bottom. working tree the files you edit leads to staging area the next commit, as it stands (git add). staging area the next commit, as it stands leads to repository the last commit and all before it (git commit). staging area the next commit, as it stands is highlighted.</desc>
