<title id="repo-layout-t">A project folder after git init</title>
<desc id="repo-layout-d">Tree, top to bottom. tipcalc/ the working tree leads to tip.py. tipcalc/ the working tree leads to .git/ the repository. .git/ the repository leads to config, refs/, ... .git/ the repository leads to objects/ where snapshots go. .git/ the repository is highlighted. tip.py is greyed out.</desc>
