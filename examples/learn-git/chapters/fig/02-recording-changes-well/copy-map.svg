<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 360" width="616" height="360" role="img" aria-labelledby="copy-map-t copy-map-d" data-kind="sequence" data-count="3">
<title id="copy-map-t">Every copying command so far</title>
<desc id="copy-map-d">Sequence between working tree, staging area and last commit, in time order. working tree sends git add to staging area. staging area sends git commit to last commit. last commit sends git restore --staged to staging area. staging area sends git restore to working tree.</desc>
