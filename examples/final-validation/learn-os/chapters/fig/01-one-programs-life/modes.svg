<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 496" width="728" height="496" role="img" aria-labelledby="modes-t modes-d" data-kind="layers" data-count="9">
<title id="modes-t">Two modes, and the doors between them</title>
<desc id="modes-d">Layers, top to bottom. User mode (ring 3) holds ./hello and C library. Doors: the CPU switches mode holds trap: syscall, fault: hlt and interrupt. Kernel mode (ring 0) holds entry points and handlers. Hardware holds CPU mode bit and disk, screen, timer. trap: syscall, fault: hlt and interrupt are highlighted.</desc>
