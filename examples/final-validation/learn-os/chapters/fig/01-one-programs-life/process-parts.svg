<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 384" width="728" height="384" role="img" aria-labelledby="process-parts-t process-parts-d" data-kind="layers" data-count="8">
<title id="process-parts-t">One process: its memory, and its PCB</title>
<desc id="process-parts-d">Layers, top to bottom. Address space (user mode) holds code, counter, heap and stack, local. PCB in the kernel holds pid, state, map, registers and fds 0 1 2 3. Process table holds every PCB, linked and read by ps. pid, state, map, registers and fds 0 1 2 3 are highlighted.</desc>
