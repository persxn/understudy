<title id="test-cycle-t">The usability test cycle</title>
<desc id="test-cycle-d">Flow chart, top to bottom. Plan what must we learn? leads to Prepare task, prototype, person. Prepare task, prototype, person leads to Run watch, stay quiet. Run watch, stay quiet leads to Analyse notes to findings. Analyse notes to findings leads to Report what the team changes. Report what the team changes leads back to Plan what must we learn? by a dashed arrow (next round). Run watch, stay quiet is highlighted.</desc>
