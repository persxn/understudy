<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 496" width="712" height="496" role="img" aria-labelledby="tree-t tree-d" data-kind="tree" data-count="7">
<title id="tree-t">Which loop should I use?</title>
<desc id="tree-d">Tree, top to bottom. Do you know how many times the loop runs before it starts? leads to for (yes). Do you know how many times the loop runs before it starts? leads to Must the body run at least once? (no). for leads to counting up or down. for leads to walking an array by index. Must the body run at least once? leads to do ... while (yes). Must the body run at least once? leads to while (no). for is highlighted.</desc>
