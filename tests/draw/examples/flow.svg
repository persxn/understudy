<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 864" width="584" height="864" role="img" aria-labelledby="flow-t flow-d" data-kind="flow" data-count="8">
<title id="flow-t">How the shell runs a command</title>
<desc id="flow-d">Flow chart, top to bottom. you press Enter leads to the shell reads the line and splits it into words. the shell reads the line and splits it into words leads to built in? built in? yes: run it inside the shell. built in? no: fork() a child process. run it inside the shell leads to prompt again. fork() a child process leads to child calls exec(). fork() a child process leads to shell waits for the child to finish by a dashed arrow (parent). child calls exec() leads to prompt again. shell waits for the child to finish leads back to the shell reads the line and splits it into words (next line).</desc>
