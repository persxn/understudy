<text class="t ink" data-role="label" data-id="fork" data-in="fork" text-anchor="middle"><tspan x="288" y="523.5"><tspan class="m">fork()</tspan> a child</tspan><tspan x="288" y="543">process</tspan></text>
<text class="t ink" data-role="label" data-id="exec" data-in="exec" text-anchor="middle"><tspan x="200" y="683.5">child calls</tspan><tspan x="200" y="703"><tspan class="m">exec()</tspan></tspan></text>
<text class="t ink" data-role="label" data-id="wait" data-in="wait" text-anchor="middle"><tspan x="376" y="673.8">shell waits for</tspan><tspan x="376" y="693.2">the child to</tspan><tspan x="376" y="712.8">finish</tspan></text>
