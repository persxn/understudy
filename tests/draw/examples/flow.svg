<text class="tt ink" data-role="title" data-id="title"><tspan x="24" y="41">How the shell runs a command</tspan></text>
<text class="t ink" data-role="label" data-id="start" data-in="start" text-anchor="middle"><tspan x="192" y="91.5">you press</tspan><tspan x="192" y="111">Enter</tspan></text>
<text class="t ink" data-role="label" data-id="read" data-in="read" text-anchor="middle"><tspan x="192" y="208">the shell reads</tspan><tspan x="192" y="227.5">the line and</tspan><tspan x="192" y="247">splits it into</tspan><tspan x="192" y="266.5">words</tspan></text>
