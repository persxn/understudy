<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 424" width="544" height="424" role="img" aria-labelledby="swap-right-t swap-right-d" data-kind="memory" data-count="5">
<title id="swap-right-t">swap gets two addresses and writes through them</title>
<desc id="swap-right-d">Memory. swap's frame (int *a, int *b). It holds a, b and temp. a holds 1000 at address 3000 and points to x (writes 7). b holds 1004 at address 3008 and points to y (writes 3). temp holds 3 at address 3016. temp is greyed out. main's frame. It holds x and y. x holds 7 at address 1000. y holds 3 at address 1004. x is highlighted. y is highlighted.</desc>
