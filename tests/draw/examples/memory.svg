<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 472" width="624" height="472" role="img" aria-labelledby="memory-t memory-d" data-kind="memory" data-count="7">
<title id="memory-t">fill gets the address of one element, not a copy of the array</title>
<desc id="memory-d">Memory. fill's frame, which holds an address and a count but none of the ints themselves. It holds p and n. p holds 1008 at address 3000 and points to a[2] (writes here). n holds 2 at address 3008. n is greyed out. main's frame: owns the array. It holds a. a holds 1, 2, 3, 4 and 5 at addresses 1000 to 1016. a[2] is highlighted.</desc>
