<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 664" width="688" height="664" role="img" aria-labelledby="sequence-t sequence-d" data-kind="sequence" data-count="6">
<title id="sequence-t">What happens when the shell runs ls</title>
<desc id="sequence-d">Sequence between shell, kernel, child process with a long name and file system, in time order. shell sends fork() to kernel. kernel sends create to child process with a long name. Note over child process with a long name: a copy of the shell, same code. child process with a long name sends exec(&quot;ls&quot;) to kernel. kernel sends load ls to file system. file system replies to kernel: program bytes. child process with a long name does run ls itself. child process with a long name replies to shell: exit status. Note over shell and kernel: the shell waits.</desc>
