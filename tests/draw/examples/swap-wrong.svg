<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 424" width="600" height="424" role="img" aria-labelledby="swap-wrong-t swap-wrong-d" data-kind="memory" data-count="5">
<title id="swap-wrong-t">swapWrong swaps its own copies: only the arrows move</title>
<desc id="swap-wrong-d">Memory. swapWrong's frame, after temp = a; a = b; b = temp;. It holds a, b and temp. a holds 1004 at address 3000 and points to y. b holds 1000 at address 3008 and points to x. temp holds 1000 at address 3016 and points to x. temp is greyed out. main's frame, untouched. It holds x and y. x holds 3 at address 1000. y holds 7 at address 1004.</desc>
