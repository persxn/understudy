<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 544" width="600" height="544" role="img" aria-labelledby="what-stays-with-you-t what-stays-with-you-d" data-kind="flow" data-count="4">
<title id="what-stays-with-you-t">What stays on your machine</title>
<desc id="what-stays-with-you-d">Flow chart, top to bottom. a month with a subscription the agent writes, reviews, tutors leads to book/ chapters, figures, reading page (writes). a month with a subscription the agent writes, reviews, tutors leads to private/ levels, practice record, RESUME.md (records). book/ chapters, figures, reading page leads to a month without read, practise, pick up the note. private/ levels, practice record, RESUME.md leads to a month without read, practise, pick up the note. a month without read, practise, pick up the note leads back to a month with a subscription the agent writes, reviews, tutors by a dashed arrow (back: say one sentence). book/ chapters, figures, reading page and private/ levels, practice record, RESUME.md are highlighted.</desc>
