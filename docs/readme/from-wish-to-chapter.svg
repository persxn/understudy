<title id="from-wish-to-chapter-t">From a wish to a reviewed chapter</title>
<desc id="from-wish-to-chapter-d">Flow chart, top to bottom. &quot;I want to learn Git&quot; leads to plan the book. plan the book leads to you approve? you approve? change it: back to plan the book. you approve? yes: one writer writes the whole chapter. one writer writes the whole chapter leads to scripts run code, paste output, draw, check. scripts run code, paste output, draw, check leads to one review: risk list, then one read. one review: risk list, then one read leads to you read and practise. scripts run code, paste output, draw, check is highlighted.</desc>
